<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Lucky Number VIP</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="shell">
    <section class="wallet card">
      <p id="welcome">ສະບາຍດີ</p>
      <span>ຍອດເງິນ In-App Wallet</span>
      <strong><span id="balance">—</span> USDT</strong>
    </section>

    <section class="prizes card accent">
      <h1>🏆 ມູນຄ່າລາງວັນສະສົມງວດນີ້</h1>
      <p id="roundInfo">ກຳລັງດຶງຂໍ້ມູນງວດ…</p>
      <div><span>🥇 ລາງວັນທີ 1</span><b id="prize1">—</b></div>
      <div><span>🥈 ລາງວັນທີ 2 (ຕໍ່ລາງວັນ)</span><b id="prize2">—</b></div>
      <div><span>🥉 ລາງວັນທີ 3 (ຕໍ່ລາງວັນ)</span><b id="prize3">—</b></div>
    </section>

    <section class="purchase card">
      <h2>ຮັບປີ້ Lucky Number</h2>
      <p>ເຊີບເວີຈະສຸ່ມເລກ 5 ຫຼັກແບບປອດໄພໃຫ້ທ່ານ · 5 USDT</p>
      <button id="buyButton" type="button">ຊື້ປີ້ສຸ່ມ</button>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>🎟️ ປີ້ຂອງທ່ານໃນງວດນີ້</h2>
      <div id="tickets" class="tickets">—</div>
    </section>

    <section class="card referral">
      <h2>🤝 ລະບົບນາຍໜ້າ</h2>
      <p>ໝູ່ທີ່ທ່ານແນະນຳ: <strong id="friendsCount">—</strong> ຄົນ</p>
    </section>
  </main>
</body>
</html>
